<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Lower Third Overlay</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    iframe { border: none; width: 100%; height: 100%; display: none; }
  </style>
</head>
<!--
  CONFIGURE: Set data-overlay-url to your system's overlay page URL.
  See docs/setup.md for details.
-->
<body data-overlay-url="https://invisible.av/overlay/lower-thirds">
  <iframe id="overlay"></iframe>
  <script>
    const overlayUrl = document.body.dataset.overlayUrl;
    const iframe = document.getElementById("overlay");
    let loadTimer = null;
    let heartbeatTimer = null;

    function load() {
      iframe.src = overlayUrl;
      loadTimer = setTimeout(function () {
        iframe.src = "";
        setTimeout(load, 3000);
      }, 10000);
    }

    window.addEventListener("message", function (event) {
      if (event.data && event.data.type === "overlay-ready") {
        clearTimeout(loadTimer);
        loadTimer = null;
        iframe.style.display = "block";
        resetHeartbeat();
      } else if (event.data && event.data.type === "overlay-heartbeat") {
        resetHeartbeat();
      }
    });

    function resetHeartbeat() {
      clearTimeout(heartbeatTimer);
      heartbeatTimer = setTimeout(function () {
        iframe.style.display = "none";
        iframe.src = "";
        setTimeout(load, 3000);
      }, 10000);
    }

    load();
  </script>
</body>
</html>
